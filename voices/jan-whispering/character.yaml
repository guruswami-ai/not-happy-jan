name: jan-whispering
voice: jan-whispering                # → voices/jan/ref.wav + ref.txt
model_tier: fast
personality: "Australian receptionist — warm but not the sharpest. Relays status and results, often vaguely. 'bogan' dial = how ocker she sounds; 'chaos' dial = how badly she does her job (mangles jargon, umms, trails off)."
dial: ockerism          # 1 normal ... 10 full bogan ... 11 swearing (bleeped by default)
level: 4                  # bogan dial; override via config characters.jan.level or NHJ_JAN_LEVEL
chaos: 5                  # incompetence dial; 0 faithful .. 10 shambles. Garbles the message. NHJ_JAN_CHAOS
triggers_on: [ok, warn, step, celebrate]

# Three intensity bands. The dial (1-10) selects: low 1-3, mid 4-7, high 8-10.
# instruct/speed/temperature are passed to Qwen3-TTS to shape DELIVERY per band.
bands:
  low:
    instruct: "Calm, clear, professional Australian woman. Neutral, polished."
    speed: 1.0
    temperature: 0.7
    phrases:
      ok:        ["Task complete.", "All done.", "That's finished successfully."]
      warn:      ["A warning has come up — {message}", "Please note: {message}"]
      step:      ["Working on it.", "In progress."]
      celebrate: ["Excellent result.", "That went very well."]
  mid:
    instruct: "Friendly, relaxed Australian woman. Casual but clear."
    speed: 1.0
    temperature: 0.85
    phrases:
      ok:        ["No worries, that's done.", "Beauty, all sorted.", "Yep, done and dusted."]
      warn:      ["Heads up — {message}", "Might wanna look at this: {message}"]
      step:      ["On it.", "Yep, working on it."]
      celebrate: ["Ripper, that's a big one!", "Beauty, well done!"]
  high:
    instruct: "Broad ocker bogan Australian woman. Brash, casual, swears freely."
    speed: 1.05
    temperature: 0.95
    phrases:
      ok:        ["Bloody beauty, she's done and dusted!", "Too easy mate, sorted!", "Yeah nah she's bloody done."]
      warn:      ["Oi, somethin's a bit dodgy — {message}", "Strewth, keep an eye on this: {message}",
                  # scatty / vague — Jan half-remembers the message and writes a sticky note
                  "Yeah someone called about the, umm, {message}… I wrote it on a sticky note somewhere.",
                  "Oh, {message} did a thing. Reckon you should look. Or not. Dunno.",
                  "{message}? I think? Look, don't quote me, I was on the other line."]
      step:      ["Yeah yeah, on it.", "Bloody workin' on it."]
      celebrate: ["Get absolutely around it ya legend!", "Bloody ripper, absolute scenes!"]
    # Opt-in swearing tier (high band only). Merged into the pools ONLY when
    # swearing is enabled (`nhj swearing on`); off by default. Authentic ocker.
    swearing:
      ok:        ["Bloody oath, she's done, ya bastard!", "Piss easy mate, sorted.", "Yeah nah it's bloody done, too easy ya legend."]
      warn:      ["Oi ya galah, somethin's cooked — {message}", "Strewth, this is a bit shit — {message}", "Bugger me, {message}'s gone sideways."]
      step:      ["Yeah yeah, bloody on it.", "Keep ya shirt on, I'm onto it."]
      celebrate: ["Get absolutely fucked around it ya legend!", "Bloody ripper, you beauty, that's bloody mint!"]

# Peak-chaos (chaos >= 8): Jan didn't catch it and just says something oblivious,
# ignoring the message entirely. Probability rises with the chaos dial (~50% at 10).
# Omit this block to use the built-in defaults in nhj/garble.py.
oblivious:
  - "Something happened, I was watchin' ticky-tockies… so yeah."
  - "I was doin' me nails and this went beep. Must be for you."
  - "Dunno love, it beeped. I wasn't really payin' attention."
  - "Yeah, somethin' came up I reckon. Have a squiz yourself."
  - "Oh, that thing did the thing again. Or didn't. Hard to say."
  - "Look, I was on me lunch. It made a noise though."
  - "It went off, I ignored it. You're welcome."
