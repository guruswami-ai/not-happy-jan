name: Docs

# Build the MkDocs site from docs/. `--strict` fails on broken internal links
# (and on pages missing from nav, once Material treats those as warnings).
#
# Pull requests: build only, so a docs break is visible before merge.
# Push to main / workflow_dispatch: build and deploy to GitHub Pages.
# Pages is already on (Settings → Pages → Source = GitHub Actions).
on:
  pull_request:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "docs/requirements.txt"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # PRs queue separately from production deploys so a docs review does not
  # sit behind (or cancel) a main deploy.
  group: docs-${{ github.event.pull_request.number || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r docs/requirements.txt
      - run: mkdocs build --strict --site-dir _site
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
