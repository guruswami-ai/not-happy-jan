name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}
      - run: uv run --python ${{ matrix.python }} --extra dev pytest -q
      - run: uv run --python ${{ matrix.python }} --extra dev ruff check src tests
      - run: bash -n install.sh

  # Linux leg: the README and docs/linux.md claim Linux support, so CI must exercise it. Its own job
  # name (not a matrix leg of `test`) keeps the required `test (3.10)` / `test (3.12)` check names stable.
  test-linux:
    name: test-linux (${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}
      - name: System audio library (sounddevice needs PortAudio)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libportaudio2
      - run: uv run --python ${{ matrix.python }} --extra dev pytest -q
      - name: Shell syntax (installer and helper scripts)
        run: |
          for f in install.sh scripts/*.sh integrations/hooks/*.sh; do bash -n "$f"; done

  package:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv build
      - name: Smoke-test wheel outside the checkout
        run: |
          uv venv /tmp/nhj-wheel
          uv pip install --python /tmp/nhj-wheel/bin/python dist/*.whl
          cd /tmp
          /tmp/nhj-wheel/bin/python -c "from nhj import resources; assert not resources._is_checkout(); assert resources.config_file().is_file(); assert resources.hooks_file().is_file(); assert resources.claude_skill_file().is_file()"
          /tmp/nhj-wheel/bin/nhj --help >/dev/null
